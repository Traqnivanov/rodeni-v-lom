<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Родени в Лом</title>
<style>
  :root{
    --bg:#0a0e1a;
    --surface:#121729;
    --surface-2:#1a2038;
    --ink:#eef1f8;
    --muted:#8993ac;
    --muted-2:#5f6786;
    --accent:#e2a53d;
    --accent-2:#f4c469;
    --line:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;}
  body{display:flex;flex-direction:column;overflow-x:hidden;}

  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 18px;border-bottom:1px solid var(--line);
    flex-wrap:wrap;gap:8px;
  }
  header h1{font-size:1.1rem;margin:0;}
  header .sub{font-size:.76rem;color:var(--muted);margin-top:2px;}
  header a.login-link{
    font-size:.8rem;color:var(--muted);text-decoration:none;
    border:1px solid var(--line);border-radius:20px;padding:6px 14px;
  }
  header a.login-link:hover{color:var(--accent-2);border-color:var(--accent);}

  .ticker-wrap{
    padding:8px 18px;font-size:.78rem;color:var(--muted-2);
    border-bottom:1px solid var(--line);min-height:16px;
    text-align:center;
  }
  .ticker-wrap span{transition:opacity .5s ease;}

  main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;}

  .map-wrap{position:relative;flex:1;min-height:340px;}
  svg#worldMap{width:100%;height:100%;display:block;touch-action:none;cursor:grab;}
  svg#worldMap:active{cursor:grabbing;}
  .country{fill:var(--surface-2);stroke:var(--bg);stroke-width:.5;}
  .country.has-data{fill:var(--accent);cursor:pointer;}
  .country:hover{stroke:var(--accent-2);stroke-width:1.2;}

  #tooltip{
    position:absolute;pointer-events:none;background:var(--surface);
    border:1px solid var(--line);border-radius:8px;padding:6px 10px;
    font-size:.78rem;color:var(--ink);transform:translate(-50%,-115%);
    white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.35);
    opacity:0;transition:opacity .12s ease;
  }
  #tooltip.show{opacity:1;}
  #tooltip b{color:var(--accent-2);}

  .hook-pill{
    position:fixed;right:16px;bottom:16px;z-index:10;
    background:var(--surface);border:1px solid var(--line);
    border-radius:24px;padding:10px 18px;font-size:.85rem;
    color:var(--ink);text-decoration:none;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .hook-pill:hover{border-color:var(--accent);color:var(--accent-2);}
  .hook-pill .q{color:var(--muted);font-size:.72rem;display:block;margin-bottom:2px;}

  #countryPanel{
    border-top:1px solid var(--line);padding:16px 18px 22px;
    max-width:640px;margin:0 auto;width:100%;
  }
  #countryPanel h2{font-size:1.02rem;margin:0 0 4px;}
  #countryPanel .count{color:var(--muted);font-size:.82rem;margin:0 0 14px;}

  .community-section{border-top:1px solid var(--line);padding:16px 18px 8px;max-width:640px;margin:0 auto;width:100%;}
  .community-section .hint{color:var(--muted);font-size:.8rem;line-height:1.5;margin:0 0 12px;transition:opacity .18s ease;}
  .community-section .tabs{
    display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;
  }
  .community-section .tab{
    background:none;border:none;color:var(--muted);font-size:.82rem;font-family:inherit;
    font-weight:600;padding:0 12px;min-height:44px;cursor:pointer;border-radius:9px;flex:1;
    min-width:max-content;display:flex;align-items:center;justify-content:center;
    transition:background .12s ease,color .12s ease;
  }
  .community-section .tab:hover{background:var(--surface-2);color:var(--ink);}
  .community-section .tab.active, .community-section .tab.active:hover{background:var(--accent);color:#1a1206;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .chip{
    background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:0 14px;min-height:40px;display:inline-flex;align-items:center;gap:6px;
    font-size:.82rem;color:var(--muted);font-family:inherit;cursor:pointer;
  }
  .chip:hover{border-color:var(--accent);color:var(--ink);}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#1a1206;}
  .chip .n{font-size:.72rem;opacity:.75;}
  .person-card{
    display:flex;gap:12px;align-items:center;padding:10px 0;
    border-top:1px solid var(--line);
  }
  .person-card:first-of-type{border-top:none;}
  .person-card img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--line);flex-shrink:0;}
  .person-card .ph-placeholder{width:44px;height:44px;border-radius:50%;background:var(--surface-2);flex-shrink:0;}
  .person-card .info{font-size:.84rem;line-height:1.5;color:var(--muted);}
  .person-card .info b{color:var(--ink);font-weight:600;}
  #countryPanel .cta{
    display:inline-block;margin-top:16px;background:var(--accent);color:#1a1206;
    text-decoration:none;font-weight:700;font-size:.86rem;padding:10px 18px;border-radius:10px;
  }
  #countryPanel .empty-cta{color:var(--muted);font-size:.85rem;line-height:1.6;}
  [hidden]{display:none!important;}
</style>
</head>
<body>

<header>
  <div>
    <h1>Родени в Лом</h1>
    <div class="sub">Карта на разпръснатите по света ломчани</div>
  </div>
  <a class="login-link" href="account.html">Вход / Профил</a>
</header>

<div class="ticker-wrap" id="tickerWrap" hidden><span id="tickerText"></span></div>

<main>
  <div class="map-wrap">
    <svg id="worldMap" viewBox="0 0 960 500" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="tooltip"></div>
    <a class="hook-pill" href="account.html"><span class="q">Карта на ломчани по света.</span>Ти къде си?</a>
  </div>
  <div id="communitySection" class="community-section" hidden>
    <div class="tabs" id="communityTabs">
      <button type="button" class="tab active" data-ctab="settlement">По населено място</button>
      <button type="button" class="tab" data-ctab="city">По град</button>
    </div>
    <p class="hint" id="communityHint">Кой още е от твоето село или квартал в Община Лом — независимо къде е по света.</p>
    <div id="communityChips" class="chips"></div>
    <div id="communityList"></div>
  </div>
  <div id="countryPanel" hidden></div>
</main>

<footer style="text-align:center;padding:14px;font-size:.76rem;color:var(--muted-2);">
  <a href="poveritelnost.html" style="color:var(--muted-2);">Поверителност</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="countries.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
(function(){
  "use strict";
  var sb = window.rodeniSupabase;

  // ISO 3166-1 numeric -> alpha-2, за държавите, покрити от списъка ни.
  var NUMERIC_TO_ALPHA2 = {
    100:"BG",276:"DE",724:"ES",826:"GB",380:"IT",300:"GR",840:"US",124:"CA",36:"AU",250:"FR",
    528:"NL",56:"BE",40:"AT",756:"CH",752:"SE",578:"NO",208:"DK",246:"FI",372:"IE",620:"PT",
    616:"PL",203:"CZ",703:"SK",348:"HU",642:"RO",705:"SI",191:"HR",688:"RS",807:"MK",8:"AL",
    70:"BA",499:"ME",792:"TR",196:"CY",470:"MT",442:"LU",352:"IS",233:"EE",428:"LV",440:"LT",
    804:"UA",498:"MD",643:"RU",112:"BY",376:"IL",784:"AE",634:"QA",682:"SA",392:"JP",410:"KR",
    156:"CN",356:"IN",764:"TH",702:"SG",554:"NZ",710:"ZA",76:"BR",32:"AR",484:"MX",152:"CL",
    818:"EG",504:"MA"
  };

  function countryName(code){
    var found = window.RODENI_COUNTRIES.find(function(p){ return p[0]===code; });
    return found ? found[1] : code;
  }

  var tooltip = document.getElementById('tooltip');
  var mapWrap = document.querySelector('.map-wrap');
  var svg = d3.select('#worldMap');
  var g = svg.append('g');
  var W = 960, H = 500;
  var projection = d3.geoNaturalEarth1();
  var path = d3.geoPath(projection);

  var countByCode = {};   // { BG: 3, DE: 12, ... }
  var entriesByCode = {}; // { BG: [row, row...] }

  function relTime(iso){
    var d = new Date(iso);
    var days = Math.floor((Date.now() - d.getTime()) / 86400000);
    if (days <= 0) return 'днес';
    if (days === 1) return 'вчера';
    if (days < 30) return 'преди ' + days + ' дни';
    var months = Math.floor(days/30);
    if (months < 12) return 'преди ' + months + (months===1?' месец':' месеца');
    return 'преди ' + Math.floor(months/12) + ' г.';
  }

  function placeLabel(row){
    if (row.city_abroad) return row.city_abroad + ', ' + countryName(row.country_code);
    return countryName(row.country_code);
  }

  // ---- тих индикатор за скорошна активност (реални данни; име само ако човекът сам го е написал) ----
  var tickerWrap = document.getElementById('tickerWrap');
  var tickerText = document.getElementById('tickerText');
  var tickerItems = [];
  var tickerIdx = 0;
  function rotateTicker(){
    if (!tickerItems.length) return;
    tickerText.style.opacity = 0;
    setTimeout(function(){
      tickerText.textContent = tickerItems[tickerIdx % tickerItems.length];
      tickerText.style.opacity = 1;
      tickerIdx++;
    }, 250);
  }

  function loadTicker(){
    sb.from('public_registrations')
      .select('country_code,city_abroad,display_name,created_at')
      .order('created_at', { ascending:false })
      .limit(8)
      .then(function(res){
        if (res.error || !res.data || !res.data.length) return;
        tickerItems = res.data.map(function(r){
          var who = r.display_name || 'Ломчанин';
          return who + ' от ' + placeLabel(r) + ' се присъедини — ' + relTime(r.created_at);
        });
        tickerWrap.hidden = false;
        rotateTicker();
        setInterval(rotateTicker, 4500);
      });
  }

  // ---- панел с хора от избраната държава ----
  var countryPanel = document.getElementById('countryPanel');
  var hookPill = document.querySelector('.hook-pill');
  var iAmRegistered = false;
  var myRegistration = null;

  // ---- секция "по общности": табове, всеки показва свои хапчета + списък под общата лента ----
  var communitySection = document.getElementById('communitySection');
  var communityTabs = document.getElementById('communityTabs');
  var communityHint = document.getElementById('communityHint');
  var communityChips = document.getElementById('communityChips');
  var communityList = document.getElementById('communityList');
  var allEntries = [];
  var activeCommunityTab = 'settlement';
  var activeSettlement = null;
  var activeCity = null;
  var entriesLoaded = false;
  var authChecked = false;

  var COMMUNITY_HINTS = {
    settlement: 'Кой още е от твоето село или квартал в Община Лом — независимо къде е по света.',
    city: 'Кой още е в твоя град в чужбина — където и да си, независимо от държавата.'
  };

  function entrySettlementLabel(r){
    if (!r.settlement) return null;
    return r.settlement === 'Друго' ? r.settlement_other : r.settlement;
  }

  function entryCityLabel(r){
    var v = (r.city_abroad || '').trim();
    return v || null;
  }

  function communityCardLine(r){
    var bits = [];
    if (r.settlement) bits.push(r.settlement === 'Друго' ? r.settlement_other : r.settlement);
    if (r.profession_category || r.profession) bits.push(r.profession_category || r.profession);
    return bits.filter(Boolean).join(' · ') || countryName(r.country_code);
  }

  function renderSettlementTab(){
    var groups = {};
    allEntries.forEach(function(r){
      var label = entrySettlementLabel(r);
      if (!label) return;
      (groups[label] = groups[label] || []).push(r);
    });
    var labels = Object.keys(groups);
    if (!labels.length){
      communitySection.hidden = true;
      return;
    }
    var mine = myRegistration ? entrySettlementLabel(myRegistration) : null;
    labels.sort(function(a, b){
      if (a === mine) return -1;
      if (b === mine) return 1;
      return groups[b].length - groups[a].length;
    });
    if (!activeSettlement || !groups[activeSettlement]) activeSettlement = labels[0];

    communityChips.innerHTML = labels.map(function(l){
      return '<button type="button" class="chip' + (l === activeSettlement ? ' active' : '') + '" data-key="' + l.replace(/"/g,'&quot;') + '">' + l + ' <span class="n">' + groups[l].length + '</span></button>';
    }).join('');

    var myId = myRegistration ? myRegistration.id : null;
    var visible = groups[activeSettlement].filter(function(r){ return r.id !== myId; });
    if (!visible.length){
      communityList.innerHTML = '<p class="empty-cta">Все още само ти си от ' + activeSettlement + ' — бъди първият, който ще намери друг оттук.</p>';
    } else {
      communityList.innerHTML = visible.slice(0, 12).map(function(r){
        var photo = r.photo_url
          ? '<img src="'+r.photo_url+'" alt="">'
          : '<div class="ph-placeholder"></div>';
        var heading = r.display_name || countryName(r.country_code);
        return '<div class="person-card">' + photo +
          '<div class="info"><b>' + heading + '</b><br>' + placeLabel(r) + '</div></div>';
      }).join('');
    }
    communitySection.hidden = false;
  }

  function renderCityTab(){
    var groups = {}; // key: lowercase trimmed city, value: {label, rows}
    allEntries.forEach(function(r){
      var label = entryCityLabel(r);
      if (!label) return;
      var key = label.toLowerCase();
      (groups[key] = groups[key] || { label: label, rows: [] }).rows.push(r);
    });
    var keys = Object.keys(groups);
    if (!keys.length){
      communitySection.hidden = true;
      return;
    }
    var mine = myRegistration && myRegistration.city_abroad ? myRegistration.city_abroad.trim().toLowerCase() : null;
    keys.sort(function(a, b){
      if (a === mine) return -1;
      if (b === mine) return 1;
      return groups[b].rows.length - groups[a].rows.length;
    });
    if (!activeCity || !groups[activeCity]) activeCity = keys[0];

    communityChips.innerHTML = keys.map(function(k){
      return '<button type="button" class="chip' + (k === activeCity ? ' active' : '') + '" data-key="' + k.replace(/"/g,'&quot;') + '">' + groups[k].label + ' <span class="n">' + groups[k].rows.length + '</span></button>';
    }).join('');

    var myId = myRegistration ? myRegistration.id : null;
    var activeGroup = groups[activeCity];
    var visible = activeGroup.rows.filter(function(r){ return r.id !== myId; });
    if (!visible.length){
      communityList.innerHTML = '<p class="empty-cta">Все още само ти си в ' + activeGroup.label + ' — бъди първият, който ще намери друг оттук.</p>';
    } else {
      communityList.innerHTML = visible.slice(0, 12).map(function(r){
        var photo = r.photo_url
          ? '<img src="'+r.photo_url+'" alt="">'
          : '<div class="ph-placeholder"></div>';
        var heading = r.display_name || countryName(r.country_code);
        return '<div class="person-card">' + photo +
          '<div class="info"><b>' + heading + '</b><br>' + communityCardLine(r) + '</div></div>';
      }).join('');
    }
    communitySection.hidden = false;
  }

  function renderCommunitySection(){
    if (!entriesLoaded || !authChecked) return;
    if (activeCommunityTab === 'settlement') renderSettlementTab();
    else if (activeCommunityTab === 'city') renderCityTab();
  }

  communityChips.addEventListener('click', function(e){
    var btn = e.target.closest('.chip');
    if (!btn) return;
    if (activeCommunityTab === 'settlement') activeSettlement = btn.dataset.key;
    else if (activeCommunityTab === 'city') activeCity = btn.dataset.key;
    renderCommunitySection();
  });

  communityTabs.addEventListener('click', function(e){
    var btn = e.target.closest('.tab');
    if (!btn) return;
    communityTabs.querySelectorAll('.tab').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    activeCommunityTab = btn.dataset.ctab;
    communityHint.style.opacity = 0;
    setTimeout(function(){
      communityHint.textContent = COMMUNITY_HINTS[activeCommunityTab] || '';
      communityHint.style.opacity = 1;
    }, 120);
    renderCommunitySection();
  });

  // ---- ако вече си регистриран, куката и "Присъедини се" не важат за теб ----
  sb.auth.getSession().then(function(res){
    var user = res.data.session && res.data.session.user;
    if (!user){
      authChecked = true;
      renderCommunitySection();
      return;
    }
    sb.from('registrations').select('id, settlement, settlement_other, city_abroad, profession_category, profession, willing_to_help').eq('user_id', user.id).maybeSingle().then(function(regRes){
      if (regRes.data){
        iAmRegistered = true;
        myRegistration = regRes.data;
        if (hookPill) hookPill.hidden = true;
      }
      authChecked = true;
      renderCommunitySection();
    });
  });

  function renderCountryPanel(code){
    var entries = entriesByCode[code] || [];
    var name = countryName(code);
    if (!entries.length){
      countryPanel.innerHTML =
        '<h2>' + name + '</h2>' +
        '<p class="empty-cta">Все още няма регистриран ломчанин оттук.' + (iAmRegistered ? '' : ' Може да си първият, който се появи на картата от ' + name + '.') + '</p>' +
        (iAmRegistered ? '' : '<a class="cta" href="account.html?country=' + code + '">Стани първият от ' + name + '</a>');
      countryPanel.hidden = false;
      return;
    }
    var cards = entries.slice(0, 12).map(function(r){
      var photo = r.photo_url
        ? '<img src="'+r.photo_url+'" alt="">'
        : '<div class="ph-placeholder"></div>';
      var bits = [];
      if (r.settlement) bits.push(r.settlement === 'Друго' ? r.settlement_other : r.settlement);
      if (r.city_abroad) bits.push(r.city_abroad);
      if (r.profession) bits.push(r.profession);
      var line = bits.filter(Boolean).join(' · ') || 'Без допълнителни данни';
      var heading = r.display_name ? r.display_name + ' · ' + name : name;
      return '<div class="person-card">' + photo +
        '<div class="info"><b>' + heading + '</b><br>' + line + '</div></div>';
    }).join('');
    countryPanel.innerHTML =
      '<h2>' + name + '</h2>' +
      '<p class="count">' + entries.length + (entries.length===1?' регистриран ломчанин':' регистрирани ломчани') + '</p>' +
      cards +
      '<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;">' +
      (iAmRegistered ? '' : '<a class="cta" href="account.html?country=' + code + '">Присъедини се и ти от ' + name + '</a>') +
      '<a class="cta" style="background:transparent;border:1px solid var(--line);color:var(--ink);" href="country.html?code=' + code + '">Пълен изглед</a>' +
      '</div>';
    countryPanel.hidden = false;
  }

  // ---- зареждане на реалните публични данни ----
  function loadRegistrations(){
    return sb.from('public_registrations').select('*').then(function(res){
      if (res.error || !res.data) return;
      allEntries = res.data;
      res.data.forEach(function(row){
        countByCode[row.country_code] = (countByCode[row.country_code] || 0) + 1;
        (entriesByCode[row.country_code] = entriesByCode[row.country_code] || []).push(row);
      });
      colorMap();
      entriesLoaded = true;
      renderCommunitySection();
    });
  }

  function colorMap(){
    g.selectAll('path.country')
      .classed('has-data', function(d){
        var code = NUMERIC_TO_ALPHA2[+d.id];
        return code && countByCode[code];
      })
      .style('fill-opacity', function(d){
        var code = NUMERIC_TO_ALPHA2[+d.id];
        var c = code ? (countByCode[code] || 0) : 0;
        if (!c) return null;
        return Math.min(1, 0.4 + c * 0.12);
      });
  }

  // ---- изчертаване на картата ----
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
    .then(function(r){ return r.json(); })
    .then(function(topology){
      var geo = topojson.feature(topology, topology.objects.countries);
      projection.fitSize([W, H], geo);

      g.selectAll('path.country')
        .data(geo.features)
        .join('path')
        .attr('class', 'country')
        .attr('d', path)
        .on('mousemove', function(event, d){
          var code = NUMERIC_TO_ALPHA2[+d.id];
          if (!code) { tooltip.classList.remove('show'); return; }
          var c = countByCode[code] || 0;
          var rect = mapWrap.getBoundingClientRect();
          tooltip.innerHTML = '<b>' + countryName(code) + '</b>' + (c ? ' — ' + c + (c===1?' човек':' души') : ' — все още никой');
          tooltip.style.left = (event.clientX - rect.left) + 'px';
          tooltip.style.top = (event.clientY - rect.top) + 'px';
          tooltip.classList.add('show');
        })
        .on('mouseleave', function(){ tooltip.classList.remove('show'); })
        .on('click', function(event, d){
          var code = NUMERIC_TO_ALPHA2[+d.id];
          if (!code) return;
          renderCountryPanel(code);
          countryPanel.scrollIntoView({ behavior:'smooth', block:'start' });
        });

      colorMap();

      var zoom = d3.zoom()
        .scaleExtent([1, 6])
        .translateExtent([[0,0],[W,H]])
        .on('zoom', function(event){
          g.attr('transform', event.transform);
        });
      svg.call(zoom);
    });

  loadRegistrations();
  loadTicker();
})();
</script>
</body>
</html>
