<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Родени в Лом — по държава</title>
<style>
  :root{
    --bg:#0a0e1a;
    --surface:#121729;
    --surface-2:#1a2038;
    --ink:#eef1f8;
    --muted:#8993ac;
    --muted-2:#5f6786;
    --accent:#e2a53d;
    --accent-2:#f4c469;
    --line:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  .wrap{max-width:640px;margin:0 auto;padding:20px 18px 40px;}
  .back-link{display:inline-block;color:var(--muted);font-size:.82rem;text-decoration:none;margin-bottom:14px;}
  .back-link:hover{color:var(--accent-2);}
  h1{font-size:1.4rem;margin:0 0 4px;}
  .count{color:var(--muted);font-size:.85rem;margin:0 0 18px;}

  select#cityFilter{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);padding:9px 12px;font-size:.85rem;font-family:inherit;margin-bottom:16px;
  }

  .tabs{
    display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;
  }
  .tab{
    background:none;border:none;color:var(--muted);font-size:.82rem;font-family:inherit;
    font-weight:600;padding:0 12px;min-height:44px;cursor:pointer;border-radius:9px;flex:1;
    min-width:max-content;display:flex;align-items:center;justify-content:center;
    transition:background .12s ease,color .12s ease;
  }
  .tab:hover{background:var(--surface-2);color:var(--ink);}
  .tab.active, .tab.active:hover{background:var(--accent);color:#1a1206;}
  .tab-hint{
    color:var(--muted);font-size:.78rem;line-height:1.5;margin:0 0 16px;
    transition:opacity .18s ease;
  }

  .person-card{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);}
  .person-card:first-of-type{border-top:none;}
  .person-card img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:1px solid var(--line);flex-shrink:0;}
  .person-card .ph-placeholder{width:52px;height:52px;border-radius:50%;background:var(--surface-2);flex-shrink:0;}
  .person-card .info{font-size:.87rem;line-height:1.55;color:var(--muted);}
  .person-card .info b{color:var(--ink);font-weight:600;}
  .person-card .pc-main{display:flex;gap:12px;align-items:center;flex:1;min-width:200px;}
  .person-card .pc-action{flex-shrink:0;margin-left:auto;}
  .badges{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0;}
  .badge{
    display:inline-block;font-size:.7rem;background:var(--surface-2);color:var(--accent-2);
    border-radius:20px;padding:2px 9px;
  }
  .connect-cta{color:var(--accent-2);font-size:.78rem;text-decoration:none;font-weight:600;}
  .connect-btn{
    background:var(--accent);color:#1a1206;border:none;border-radius:8px;
    padding:0 14px;min-height:36px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .connect-btn:disabled{opacity:.6;cursor:default;}
  .connect-hint{color:var(--muted);font-size:.76rem;}

  .empty{color:var(--muted);font-size:.88rem;line-height:1.6;padding:20px 0;}
  .cta{
    display:inline-block;margin-top:20px;background:var(--accent);color:#1a1206;
    text-decoration:none;font-weight:700;font-size:.9rem;padding:11px 20px;border-radius:10px;
  }
  [hidden]{display:none!important;}

  @media (min-width:900px){
    .wrap{ max-width:900px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">← Към картата</a>
  <h1 id="countryTitle">…</h1>
  <p class="count" id="countryCount"></p>

  <select id="cityFilter" hidden></select>

  <div class="tabs">
    <button class="tab active" data-tab="all">Хора</button>
    <button class="tab" data-tab="help">Готови да помагат</button>
    <button class="tab" data-tab="open">Отворени за общуване</button>
    <button class="tab" data-tab="profession">По професия</button>
  </div>
  <p class="tab-hint" id="tabHint">Всички регистрирани от тази държава.</p>

  <div id="list"></div>
  <div id="emptyMsg" class="empty" hidden></div>

  <a class="cta" id="joinCta" href="account.html">Присъедини се</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="countries.js"></script>
<script>
(function(){
  "use strict";
  var sb = window.rodeniSupabase;

  var params = new URLSearchParams(window.location.search);
  var code = (params.get('code') || '').toUpperCase();

  function countryName(c){
    var found = window.RODENI_COUNTRIES.find(function(p){ return p[0]===c; });
    return found ? found[1] : c;
  }

  function escapeHtml(s){
    var div = document.createElement('div');
    div.textContent = s == null ? '' : String(s);
    return div.innerHTML;
  }

  // за влагане в кавички на атрибут - escapeHtml (през textContent) не пази
  // кавичките, те не са специални в текстов възел
  function escapeAttr(s){
    return (s == null ? '' : String(s))
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  var countryTitle = document.getElementById('countryTitle');
  var countryCount = document.getElementById('countryCount');
  var cityFilter = document.getElementById('cityFilter');
  var listEl = document.getElementById('list');
  var emptyMsg = document.getElementById('emptyMsg');
  var joinCta = document.getElementById('joinCta');
  var tabs = document.querySelectorAll('.tab');

  countryTitle.textContent = countryName(code) || 'Държава';
  joinCta.href = 'account.html?country=' + encodeURIComponent(code);

  var iAmRegistered = false;
  var myRegistration = null;
  var myConnections = [];
  var blockedIds = {};
  var authChecked = false;
  var entriesLoaded = false;

  // ---- действие на всяка картичка: зависи дали си регистриран и какъв е статусът към човека ----
  function connectionActionHtml(r){
    if (!iAmRegistered){
      return '<a class="connect-cta" href="account.html">Присъедини се, за да пишеш</a>';
    }
    var myId = myRegistration.id;
    var existing = myConnections.find(function(c){
      return (c.from_registration_id === myId && c.to_registration_id === r.id)
          || (c.to_registration_id === myId && c.from_registration_id === r.id);
    });
    if (!existing){
      return '<button type="button" class="connect-btn" data-id="' + r.id + '">Искам да се свържа</button>';
    }
    if (existing.status === 'pending'){
      return existing.from_registration_id === myId
        ? '<span class="connect-hint">Изчаква отговор</span>'
        : '<span class="connect-hint">Виж молбите към теб</span>';
    }
    return '<a class="connect-cta" href="razgovor.html?id=' + existing.id + '">Вече сте свързани — Пиши</a>';
  }

  function loadMyConnections(){
    if (!myRegistration){
      myConnections = [];
      blockedIds = {};
      return Promise.resolve();
    }
    return sb.from('connections').select('*')
      .or('from_registration_id.eq.' + myRegistration.id + ',to_registration_id.eq.' + myRegistration.id)
      .then(function(res){
        myConnections = res.data || [];
        blockedIds = {};
        myConnections.forEach(function(c){
          if (c.status !== 'blocked') return;
          var otherId = c.from_registration_id === myRegistration.id ? c.to_registration_id : c.from_registration_id;
          blockedIds[otherId] = true;
        });
      });
  }

  function tryRender(){
    if (!entriesLoaded || !authChecked) return;
    render();
  }

  listEl.addEventListener('click', async function(e){
    var btn = e.target.closest('.connect-btn');
    if (!btn) return;
    btn.disabled = true;
    var res = await sb.from('connections').insert({
      from_registration_id: myRegistration.id,
      to_registration_id: btn.dataset.id
    });
    if (res.error){
      btn.outerHTML = '<span class="connect-hint">Грешка: ' + escapeHtml(res.error.message) + '</span>';
      return;
    }
    await loadMyConnections();
    render();
  });

  // ---- ако вече си регистриран, "Присъедини се" не важи за теб - крием го ----
  sb.auth.getSession().then(function(res){
    var user = res.data.session && res.data.session.user;
    if (!user){
      authChecked = true;
      tryRender();
      return;
    }
    sb.from('registrations').select('id').eq('user_id', user.id).maybeSingle().then(function(regRes){
      if (regRes.data){
        iAmRegistered = true;
        myRegistration = regRes.data;
        joinCta.hidden = true;
      }
      loadMyConnections().then(function(){
        authChecked = true;
        tryRender();
      });
    });
  });

  var allEntries = [];
  var activeTab = 'all';
  var activeCity = '';

  function personLine(r){
    var bits = [];
    if (r.settlement) bits.push(r.settlement === 'Друго' ? r.settlement_other : r.settlement);
    if (r.city_abroad) bits.push(r.city_abroad);
    if (r.school) bits.push(r.school === 'Друго' ? r.school_other : r.school);
    if (r.age) bits.push(r.age + ' г.');
    return escapeHtml(bits.filter(Boolean).join(' · ') || 'Без допълнителни данни');
  }

  function render(){
    var myId = myRegistration ? myRegistration.id : null;
    var rows = allEntries.filter(function(r){ return r.id !== myId && !blockedIds[r.id]; });
    if (activeCity) rows = rows.filter(function(r){ return r.city_abroad === activeCity; });
    if (activeTab === 'open') rows = rows.filter(function(r){ return r.open_to_strangers; });
    if (activeTab === 'profession') rows = rows.filter(function(r){ return !!(r.profession_category || r.profession); });
    if (activeTab === 'help') rows = rows.filter(function(r){ return r.willing_to_help; });

    if (!rows.length){
      listEl.innerHTML = '';
      emptyMsg.textContent = allEntries.length
        ? 'Няма никой в тази категория засега.'
        : 'Все още няма регистриран ломчанин от ' + countryName(code) + '. Може да си първият.';
      emptyMsg.hidden = false;
      return;
    }
    emptyMsg.hidden = true;
    listEl.innerHTML = rows.map(function(r){
      var photo = r.photo_url
        ? '<img src="'+r.photo_url+'" alt="">'
        : '<div class="ph-placeholder"></div>';
      var profBadge = r.profession_category
        ? '<span class="badge">'+escapeHtml(r.profession_category)+'</span>'
        : (r.profession ? '<span class="badge">'+escapeHtml(r.profession)+'</span>' : '');
      var openBadge = r.open_to_strangers ? '<span class="badge">отворен за общуване</span>' : '';
      var helpBadge = r.willing_to_help ? '<span class="badge">готов да помага</span>' : '';
      var heading = escapeHtml(r.display_name ? r.display_name : countryName(code));
      var badges = profBadge + openBadge + helpBadge;
      return '<div class="person-card"><div class="pc-main">' + photo +
        '<div class="info"><b>' + heading + '</b>' +
        (badges ? '<div class="badges">' + badges + '</div>' : '<br>') +
        personLine(r) + '</div></div>' +
        '<div class="pc-action">' + connectionActionHtml(r) + '</div></div>';
    }).join('');
  }

  var tabHint = document.getElementById('tabHint');
  var TAB_HINTS = {
    all: 'Всички регистрирани от тази държава.',
    help: 'Отговарят на въпроси — виза, работа, животът там и т.н.',
    open: 'Искат да се запознаят с други ломчани наблизо.',
    profession: 'Групирани по сфера на работа.'
  };

  tabs.forEach(function(btn){
    btn.addEventListener('click', function(){
      tabs.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      activeTab = btn.dataset.tab;
      tabHint.style.opacity = 0;
      setTimeout(function(){
        tabHint.textContent = TAB_HINTS[activeTab] || '';
        tabHint.style.opacity = 1;
      }, 120);
      render();
    });
  });

  cityFilter.addEventListener('change', function(){
    activeCity = cityFilter.value;
    render();
  });

  function setupCityFilter(){
    var cities = Array.from(new Set(allEntries.map(function(r){ return r.city_abroad; }).filter(Boolean))).sort();
    if (cities.length < 2){ cityFilter.hidden = true; return; }
    cityFilter.innerHTML = '<option value="">Всички градове</option>' +
      cities.map(function(c){ return '<option value="'+escapeAttr(c)+'">'+escapeHtml(c)+'</option>'; }).join('');
    cityFilter.hidden = false;
  }

  if (!code){
    countryTitle.textContent = 'Няма избрана държава';
    emptyMsg.textContent = 'Върни се към картата и избери държава.';
    emptyMsg.hidden = false;
  } else {
    sb.from('public_registrations').select('*').eq('country_code', code).then(function(res){
      if (res.error){
        emptyMsg.textContent = 'Грешка при зареждане: ' + res.error.message;
        emptyMsg.hidden = false;
        return;
      }
      allEntries = res.data || [];
      countryCount.textContent = allEntries.length
        ? allEntries.length + (allEntries.length===1?' регистриран ломчанин':' регистрирани ломчани')
        : '';
      setupCityFilter();
      entriesLoaded = true;
      tryRender();
    });
  }
})();
</script>
</body>
</html>
