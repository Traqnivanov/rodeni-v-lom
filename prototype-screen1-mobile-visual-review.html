<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screen 1 · Mobile Visual Review</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#070d18;color:#f8f4e9}
*{box-sizing:border-box}body{margin:0;padding:16px;background:#070d18}.bar{position:static;background:#0d1829;border:1px solid #33445e;border-radius:14px;padding:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:end;max-width:900px;margin:0 auto 16px}.bar label{display:grid;gap:5px;font-size:14px;color:#cbd5e5}.bar select,.bar button{min-height:44px;border:1px solid #52627a;border-radius:10px;background:#101f35;color:#fff;padding:8px 10px;font:inherit}.bar button{font-weight:700;background:#e9b953;color:#251b09;border:0}.note{max-width:900px;margin:0 auto 12px;color:#aab8cc;font-size:14px;line-height:1.45}.device{margin:0 auto;padding:8px;background:#111f34;border:1px solid #33445e;border-radius:20px;width:max-content;max-width:100%;box-shadow:0 18px 60px #0008}.label{text-align:center;color:#aab8cc;font-size:13px;padding:4px 0 8px}.viewport{overflow:hidden;border-radius:12px;background:#080f1d}.viewport iframe{display:block;border:0;height:812px;background:#080f1d}
</style>
</head>
<body>
<div class="bar">
<label>Viewport
<select id="width"><option value="360">360 px</option><option value="390" selected>390 px</option><option value="412">412 px</option></select>
</label>
<label>Сценарий
<select id="scenario">
<option value="initial">Начален екран</option>
<option value="current">Current · празен</option>
<option value="munich">Current · Германия / Мюнхен</option>
<option value="draft">Current · list-only / Дрезден</option>
<option value="t6dense">T6 · dense US search / 10 results</option>
<option value="t6sparse">T6 · sparse SI search / 1 result</option>
<option value="t6long">T6 · long locality / Canada</option>
<option value="t6longcountry">T6 · long country / UAE</option>
<option value="t6switch">T6 · country switch / DE → FR</option>
<option value="t6recovery">T6 · expired session recovery</option>
<option value="t7perf">T7 · search/switch timing probe</option>
<option value="root">Root · Мюнхен → Лом</option>
<option value="rootlatin">Root · Latin search / Lom</option>
<option value="rootburgas">Root · Бургас → resolver canonical</option>
<option value="rootunknown">Root · Стара Загора → unverified option</option>
<option value="rootnear">Map · Ковачица ↔ Лом</option>
<option value="rootsame">Map · Лом ↔ Лом</option>
<option value="exact">Result · exact</option>
<option value="broader">Result · safe-broader</option>
<option value="suppressed">Result · suppressed</option>
<option value="currentonly">Result · Current-only</option>
<option value="loading">Loading state</option>
<option value="error">Error state</option>
<option value="retry">Retry · temporary error → success</option>
<option value="posterror">Post-error continue</option>
<option value="mt">MT · без map geometry / без предложения</option>
<option value="lu">LU · има geometry / без предложения</option>
<option value="sg">SG · без map geometry</option>
</select>
</label>
<label>Текст
<select id="zoom"><option value="100">100%</option><option value="200">200%</option></select>
</label>
<button id="apply">Покажи</button>
</div>
<p class="note">Review-only harness. Не променя Screen 1. Зарежда текущия active prototype в фиксиран mobile viewport и автоматично отваря избрания demo state.</p>
<div class="device">
<div class="label" id="label"></div>
<div class="viewport"><iframe id="frame" src="prototype-screen1-map-interaction-lab.html"></iframe></div>
</div>
<script>
const frame=document.getElementById('frame'),width=document.getElementById('width'),scenario=document.getElementById('scenario'),zoom=document.getElementById('zoom'),label=document.getElementById('label');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function fire(el,type){el.dispatchEvent(new Event(type,{bubbles:true}))}
async function selectSuggestion(doc,id,name){
  const input=doc.getElementById(id);input.focus();input.value=name;fire(input,'input');
  for(let attempt=0;attempt<6;attempt++){
    await wait(60);
    const opt=[...doc.querySelectorAll('#'+id+'Options [role="option"]')].find(x=>(x.dataset.name||'')===name);
    if(opt){opt.click();await wait(100);return true}
  }
  return false;
}
async function current(doc,country,name){
  doc.getElementById('start').click();await wait(80);
  const c=doc.getElementById('country');c.value=country;fire(c,'change');await wait(80);
  if(name)await selectSuggestion(doc,'current',name);
}
async function root(doc,name){
  doc.getElementById('next').click();await wait(80);
  if(name)await selectSuggestion(doc,'root',name);
}
async function currentQuery(doc,country,query){
  doc.getElementById('start').click();await wait(80);
  const c=doc.getElementById('country');c.value=country;fire(c,'change');await wait(100);
  const input=doc.getElementById('current');input.focus();input.value=query;fire(input,'input');await wait(180);
}

async function rootLatin(doc,typed){
  doc.getElementById('next').click();await wait(80);
  const input=doc.getElementById('root');input.focus();input.value=typed;fire(input,'input');await wait(100);
}
async function applyState(){
  document.body.dataset.reviewReady='false';
  const mode=scenario.value;
  const w=Number(width.value);frame.style.width=w+'px';label.textContent=w+' px · '+scenario.options[scenario.selectedIndex].text+' · текст '+zoom.value+'%';
  frame.src='prototype-screen1-map-interaction-lab.html?review='+Date.now();
  await new Promise(resolve=>frame.onload=()=>resolve());
  frame.contentWindow.sessionStorage.clear();
  if(mode==='t6recovery'){
    frame.contentWindow.sessionStorage.setItem('rodeni-work-screen1-c2',JSON.stringify({
      version:1,updated:Date.now()-90000000,country:'DE',current:'DE|Мюнхен',currentDraft:'',root:'BG|Лом',rootDraft:'',pending:''
    }));
  }
  frame.contentWindow.location.reload();
  await new Promise(resolve=>frame.onload=()=>resolve());
  const doc=frame.contentDocument;
  if(mode==='current'){doc.getElementById('start').click();await wait(100)}
  if(mode==='munich'){await current(doc,'DE','Мюнхен')}
  if(mode==='draft'){await current(doc,'DE','Дрезден')}
  if(mode==='t6dense'){await currentQuery(doc,'US','а')}
  if(mode==='t6sparse'){await currentQuery(doc,'SI','люб')}
  if(mode==='t6long'){await currentQuery(doc,'CA','сейнт')}
  if(mode==='t6longcountry'){await current(doc,'AE','')}
  if(mode==='t6switch'){
    await current(doc,'DE','Мюнхен');
    const c=doc.getElementById('country');c.value='FR';fire(c,'change');await wait(180);
  }
  if(mode==='t6recovery'){doc.getElementById('start').click();await wait(180);doc.getElementById('panel')?.scrollIntoView({block:'start'});await wait(120)}
  let perfInfo='';
  if(mode==='t7perf'){
    doc.getElementById('start').click();await wait(80);
    let country=doc.getElementById('country');country.value='US';fire(country,'change');await wait(80);
    const input=doc.getElementById('current'),samples=[];
    for(const q of ['а','ан','сан','о','е','и','ар','ла','ч','ф']){
      input.value=q;
      const t0=performance.now();fire(input,'input');samples.push(performance.now()-t0);
    }
    const optionCount=doc.querySelectorAll('#currentOptions [role="option"]').length;
    country=doc.getElementById('country');country.value='DE';fire(country,'change');await wait(80);
    await selectSuggestion(doc,'current','Мюнхен');
    country=doc.getElementById('country');
    const t1=performance.now();country.value='FR';fire(country,'change');const switchMs=performance.now()-t1;
    const max=Math.max(...samples),avg=samples.reduce((a,b)=>a+b,0)/samples.length;
    perfInfo=' · searchAvg='+avg.toFixed(2)+'ms · searchMax='+max.toFixed(2)+'ms · opts='+optionCount+' · switch='+switchMs.toFixed(2)+'ms';
  }
  if(mode==='root'){await current(doc,'DE','Мюнхен');await root(doc,'Лом')}
  if(mode==='rootlatin'){await current(doc,'DE','Мюнхен');await rootLatin(doc,'Lom')}
  if(mode==='rootburgas'){await current(doc,'DE','Мюнхен');await root(doc,'Бургас');await wait(300);doc.getElementById('lookup').click();await wait(300)}
  if(mode==='rootunknown'){await current(doc,'DE','Мюнхен');await root(doc,'Стара Загора');await wait(300);doc.getElementById('lookup').click();await wait(300)}
  if(mode==='rootnear'){await current(doc,'BG','Ковачица');await root(doc,'Лом');doc.getElementById('map')?.scrollIntoView({block:'start'});await wait(180)}
  if(mode==='rootsame'){await current(doc,'BG','Лом');await root(doc,'Лом');doc.getElementById('map')?.scrollIntoView({block:'start'});await wait(180)}
  if(mode==='exact'){await current(doc,'DE','Мюнхен');await root(doc,'Лом');doc.getElementById('next').click();await wait(800)}
  if(mode==='broader'){await current(doc,'FR','Париж');await root(doc,'Ковачица');doc.getElementById('next').click();await wait(800)}
  if(mode==='suppressed'){await current(doc,'AT','Грац');await root(doc,'София');doc.getElementById('next').click();await wait(800)}
  if(mode==='currentonly'){await current(doc,'FR','Париж');await root(doc,'Стара Загора');await wait(180);doc.getElementById('lookup').click();await wait(180);doc.getElementById('unverified').click();await wait(800)}
  if(mode==='loading'){await current(doc,'DE','Мюнхен');await root(doc,'Лом');frame.contentWindow.eval("state.view='loading';render();cancel()");await wait(120)}
  if(mode==='error'){doc.getElementById('network').value='fail';fire(doc.getElementById('network'),'change');await current(doc,'DE','Мюнхен');await root(doc,'Лом');doc.getElementById('next').click();await wait(800)}
  if(mode==='retry'){doc.getElementById('network').value='once';fire(doc.getElementById('network'),'change');await current(doc,'DE','Мюнхен');await root(doc,'Лом');doc.getElementById('next').click();await wait(800);doc.getElementById('retry').click();await wait(800)}
  if(mode==='posterror'){doc.getElementById('network').value='fail';fire(doc.getElementById('network'),'change');await current(doc,'DE','Мюнхен');await root(doc,'Лом');doc.getElementById('next').click();await wait(800);doc.getElementById('retry').click();await wait(800);doc.getElementById('skip').click();await wait(160)}
  if(mode==='mt'){await current(doc,'MT','')}
  if(mode==='lu'){await current(doc,'LU','')}
  if(mode==='sg'){await current(doc,'SG','')}
  if(zoom.value==='200'){
    doc.getElementById('textSize').click();await wait(120);
    if(mode==='t6dense'){doc.getElementById('currentOptions')?.scrollIntoView({block:'center'});await wait(120)}
  }
  await wait(120);
  document.body.dataset.reviewReady='true';
  let stored=null;try{stored=JSON.parse(frame.contentWindow.sessionStorage.getItem('rodeni-work-screen1-c2')||'null')}catch{}
  const stateInfo=stored?' · country='+(stored.country||'∅')+' · current='+(stored.current||'∅')+' · currentDraft='+(stored.currentDraft||'∅')+' · root='+(stored.root||'∅')+' · rootDraft='+(stored.rootDraft||'∅')+' · pending='+(stored.pending||'∅'):'';
  label.textContent=w+' px · '+scenario.options[scenario.selectedIndex].text+' · текст '+zoom.value+'% · готово'+stateInfo+(typeof perfInfo==='string'?perfInfo:'');
}
document.getElementById('apply').onclick=applyState;
const params=new URLSearchParams(location.search);
if(['360','390','412'].includes(params.get('w')))width.value=params.get('w');
if([...scenario.options].some(o=>o.value===params.get('s')))scenario.value=params.get('s');
if(['100','200'].includes(params.get('z')))zoom.value=params.get('z');
applyState();
</script>
</body></html>
