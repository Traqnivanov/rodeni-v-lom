<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Родени в Лом — разговор</title>
<style>
  :root{
    --bg:#0a0e1a;
    --surface:#121729;
    --surface-2:#1a2038;
    --ink:#eef1f8;
    --muted:#8993ac;
    --muted-2:#5f6786;
    --accent:#e2a53d;
    --accent-2:#f4c469;
    --line:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  header{
    display:flex;align-items:center;gap:10px;padding:14px 16px;
    border-bottom:1px solid var(--line);flex-shrink:0;
  }
  header a.back{color:var(--muted);text-decoration:none;font-size:1.1rem;}
  header .who{font-size:.92rem;font-weight:600;}
  header .who .sub{display:block;font-weight:400;font-size:.74rem;color:var(--muted);}

  #messages{
    flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;
    max-width:640px;width:100%;margin:0 auto;
  }
  .msg{
    max-width:78%;padding:9px 13px;border-radius:14px;font-size:.9rem;line-height:1.45;
    word-wrap:break-word;
  }
  .msg.mine{align-self:flex-end;background:var(--accent);color:#1a1206;border-bottom-right-radius:4px;}
  .msg.theirs{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;}
  .msg .time{display:block;font-size:.68rem;opacity:.65;margin-top:3px;}

  .empty-hint{color:var(--muted);font-size:.85rem;text-align:center;padding:30px 16px;line-height:1.6;}

  form#sendForm{
    display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);
    max-width:640px;width:100%;margin:0 auto;flex-shrink:0;
  }
  #msgInput{
    flex:1;background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:10px 16px;color:var(--ink);font-size:.9rem;font-family:inherit;
  }
  #msgInput:focus{outline:2px solid var(--accent);outline-offset:1px;}
  #sendBtn{
    background:var(--accent);color:#1a1206;border:none;border-radius:20px;
    padding:10px 18px;font-weight:700;font-size:.9rem;cursor:pointer;font-family:inherit;
  }
  #sendBtn:disabled{opacity:.6;cursor:default;}

  #sendError{
    max-width:640px;width:100%;margin:0 auto;padding:0 16px 8px;
    color:#e07a6b;font-size:.8rem;
  }

  .status{padding:16px;color:var(--muted);font-size:.9rem;text-align:center;}
  [hidden]{display:none!important;}
</style>
</head>
<body>

<header>
  <a class="back" href="account.html">←</a>
  <div class="who"><span id="whoName">…</span><span class="sub">Никой друг не вижда този разговор.</span></div>
</header>

<div id="statusMsg" class="status" hidden></div>
<div id="messages" hidden></div>
<div id="emptyHint" class="empty-hint" hidden>Все още няма съобщения — напиши първото.</div>

<div id="sendError" hidden></div>
<form id="sendForm" hidden>
  <input type="text" id="msgInput" placeholder="Напиши съобщение…" maxlength="1000" autocomplete="off">
  <button type="submit" id="sendBtn">Изпрати</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="countries.js"></script>
<script>
(function(){
  "use strict";
  var sb = window.rodeniSupabase;

  var whoName = document.getElementById('whoName');
  var statusMsg = document.getElementById('statusMsg');
  var messagesEl = document.getElementById('messages');
  var emptyHint = document.getElementById('emptyHint');
  var sendForm = document.getElementById('sendForm');
  var msgInput = document.getElementById('msgInput');
  var sendBtn = document.getElementById('sendBtn');
  var sendError = document.getElementById('sendError');

  var connectionId = new URLSearchParams(window.location.search).get('id');
  var myRegistrationId = null;
  var renderedIds = {};

  function countryName(code){
    var found = window.RODENI_COUNTRIES.find(function(p){ return p[0]===code; });
    return found ? found[1] : code;
  }
  function personSummary(r){
    var bits = [];
    if (r.display_name) bits.push(r.display_name);
    bits.push(countryName(r.country_code));
    if (r.city_abroad) bits.push(r.city_abroad);
    if (r.profession_category || r.profession) bits.push(r.profession_category || r.profession);
    return bits.filter(Boolean).join(' · ');
  }
  function showStatus(text){
    statusMsg.textContent = text;
    statusMsg.hidden = false;
    messagesEl.hidden = true;
    sendForm.hidden = true;
  }
  function escapeHtml(s){
    var div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }
  function timeLabel(iso){
    var d = new Date(iso);
    return d.toLocaleString('bg-BG', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
  }

  function appendMessage(m){
    if (renderedIds[m.id]) return;
    renderedIds[m.id] = true;
    emptyHint.hidden = true;
    var div = document.createElement('div');
    div.className = 'msg ' + (m.sender_registration_id === myRegistrationId ? 'mine' : 'theirs');
    div.innerHTML = escapeHtml(m.body) + '<span class="time">' + timeLabel(m.created_at) + '</span>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function init(){
    if (!connectionId){
      showStatus('Липсва разговор — върни се към профила си.');
      return;
    }
    var sessionRes = await sb.auth.getSession();
    var user = sessionRes.data.session && sessionRes.data.session.user;
    if (!user){
      showStatus('Трябва да влезеш, за да видиш този разговор.');
      return;
    }

    var myRegRes = await sb.from('registrations').select('id').eq('user_id', user.id).maybeSingle();
    if (myRegRes.error || !myRegRes.data){
      showStatus('Нямаш регистрация още.');
      return;
    }
    myRegistrationId = myRegRes.data.id;

    var connRes = await sb.from('connections').select('*').eq('id', connectionId).maybeSingle();
    if (connRes.error || !connRes.data){
      showStatus('Този разговор не е достъпен за теб.');
      return;
    }
    var conn = connRes.data;
    if (conn.status !== 'accepted'){
      showStatus('Тази връзка още не е приета от двете страни.');
      return;
    }
    var otherId = conn.from_registration_id === myRegistrationId ? conn.to_registration_id : conn.from_registration_id;
    if (conn.from_registration_id !== myRegistrationId && conn.to_registration_id !== myRegistrationId){
      showStatus('Този разговор не е достъпен за теб.');
      return;
    }

    var otherRes = await sb.from('public_registrations').select('*').eq('id', otherId).maybeSingle();
    whoName.textContent = otherRes.data ? personSummary(otherRes.data) : 'Разговор';

    var msgRes = await sb.from('messages').select('*').eq('connection_id', connectionId).order('created_at', { ascending: true });
    messagesEl.hidden = false;
    sendForm.hidden = false;
    statusMsg.hidden = true;
    if (!msgRes.data || !msgRes.data.length){
      emptyHint.hidden = false;
    } else {
      msgRes.data.forEach(appendMessage);
    }

    sb.channel('messages-' + connectionId)
      .on('postgres_changes', {
        event: 'INSERT', schema: 'public', table: 'messages',
        filter: 'connection_id=eq.' + connectionId
      }, function(payload){
        appendMessage(payload.new);
      })
      .subscribe();

    sendForm.addEventListener('submit', async function(e){
      e.preventDefault();
      var body = msgInput.value.trim();
      if (!body) return;
      sendBtn.disabled = true;
      sendError.hidden = true;
      var res = await sb.from('messages').insert({
        connection_id: connectionId,
        sender_registration_id: myRegistrationId,
        body: body
      }).select().single();
      sendBtn.disabled = false;
      if (res.error){
        sendError.textContent = 'Съобщението не се изпрати: ' + res.error.message;
        sendError.hidden = false;
        return;
      }
      msgInput.value = '';
      appendMessage(res.data);
    });
  }

  init();
})();
</script>
</body>
</html>
